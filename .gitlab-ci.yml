workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

test-gitlab-automation:
  image: python:3.13-bookworm
  timeout: 10 minutes
  interruptible: true
  script:
    - python3 --version
    - git --version
    - python3 -m unittest discover -s gitlab -p 'test_*.py'
    - python3 -m unittest discover -s sync-reminders -p 'test_*.py'

remind-github:
  image: python:3.13-slim-bookworm
  stage: .post
  timeout: 10 minutes
  interruptible: false
  resource_group: counterpart-reminders
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
  script:
    - python3 sync-reminders/notify.py gitlab
