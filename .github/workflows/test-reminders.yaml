name: Test counterpart reminders

on:
  pull_request:
    paths:
      - sync-reminders/**
      - .github/workflows/remind-gitlab.yaml
      - .github/workflows/test-reminders.yaml
  push:
    branches: [main]
    paths:
      - sync-reminders/**
      - .github/workflows/remind-gitlab.yaml
      - .github/workflows/test-reminders.yaml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s sync-reminders -p 'test_*.py'
