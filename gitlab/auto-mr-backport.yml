# Include with an immutable ref and set BACKPORT_ACTIONS_REF to the same SHA.
auto-mr-backport:
  image: python:3.13-bookworm
  stage: .post
  timeout: 15 minutes
  interruptible: false
  resource_group: auto-mr-backport
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^[0-9]+(\.[0-9]+)?$/)'
  script:
    - |
      python3 - <<'PY'
      import os
      import re
      from urllib.request import urlopen
      from pathlib import Path
      ref = os.environ.get('BACKPORT_ACTIONS_REF', '')
      if not re.fullmatch(r'[a-f0-9]{40}', ref):
          raise SystemExit('BACKPORT_ACTIONS_REF must be the immutable include commit SHA')
      url = f"{os.environ['CI_SERVER_URL']}/josh-wong/actions/-/raw/{ref}/gitlab/backport.py"
      with urlopen(url, timeout=60) as response:
          Path('/tmp/backport.py').write_bytes(response.read())
      PY
    - python3 /tmp/backport.py
