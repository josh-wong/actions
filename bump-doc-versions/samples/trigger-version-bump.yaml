# Public repo trigger for bump-doc-versions.
#
# Copy to `.github/workflows/trigger-version-bump.yml` in the public docs repo
# (e.g., docs-scalardb, docs-scalardl), replacing <PRODUCT> with `scalardb` or `scalardl`.
#
# Fires on any push to `main` that touches `docusaurus.config.js`. Detects a `className` diff, then dispatches a `bump-patch` event into the internal repo, where the authoritative bump PR is opened against the matching version branch (e.g., `3.17`).
#
# The public repo's docs are updated via the internal repo's sync workflow (sync-docs-<PRODUCT>.yml on each version branch) after the internal PR merges — no PR is opened against the public repo directly.

name: 🔢 Trigger version bump on className change

on:
  push:
    branches: [main]
    paths: [docusaurus.config.js]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      bumps: ${{ steps.diff.outputs.bumps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout detect-classname-diff script
        uses: actions/checkout@v4
        with:
          repository: josh-wong/actions
          ref: main
          sparse-checkout: bump-doc-versions
          path: actions-tools

      - name: Extract before/after docusaurus.config.js
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.event.after }}
        run: |
          git show "$BEFORE_SHA:docusaurus.config.js" > /tmp/before.js 2>/dev/null || : > /tmp/before.js
          git show "$AFTER_SHA:docusaurus.config.js"  > /tmp/after.js

      - name: Detect className diffs
        id: diff
        run: |
          bumps=$(node actions-tools/bump-doc-versions/detect-classname-diff.mjs \
            --before /tmp/before.js \
            --after  /tmp/after.js)
          echo "bumps=$bumps" >> "$GITHUB_OUTPUT"
          echo "Detected: $bumps"

  dispatch-internal:
    needs: detect
    if: needs.detect.outputs.bumps != '' && needs.detect.outputs.bumps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bump: ${{ fromJson(needs.detect.outputs.bumps) }}
    steps:
      - name: Dispatch bump into docs-internal-<PRODUCT>
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BUMP_DISPATCH_PAT }}
          script: |
            const bump = ${{ toJson(matrix.bump) }};
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo:  'docs-internal-<PRODUCT>',
              event_type: 'bump-patch',
              client_payload: { product: '<PRODUCT>', ...bump },
            });
            core.notice(`Dispatched bump-patch { minor: ${bump.minor}, from: ${bump.from}, to: ${bump.to} } into ${context.repo.owner}/docs-internal-<PRODUCT>`);
