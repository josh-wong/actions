name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deletions are intentionally not propagated by this workflow.
    if: github.event.deleted != true
    steps:
      - name: Check out all history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push branches and tags without force
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITLAB_TOKEN"
          askpass="$RUNNER_TEMP/gitlab-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' oauth2 ;;
            *) printf '%s' "$GITLAB_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          # Refresh heads explicitly: origin/HEAD is a symbolic ref, not a branch.
          git fetch --no-tags origin 'refs/heads/*:refs/mirror-heads/*'
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push --atomic https://gitlab.com/josh-wong/actions.git \
              'refs/mirror-heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
